name: Garder Noryn en ligne
# Réveille le serveur Noryn (hébergement gratuit Render qui s'endort après 15 min sans visite)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appeler Noryn
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://noryn-jhbf.onrender.com/api/sante || true)
            echo "Essai $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 0
